name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install "./apps/api[dev]"
      - run: cd apps/api && ruff check app tests
      - run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/web && npm install --no-audit --no-fund
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
