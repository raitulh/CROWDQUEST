name: crowdquest-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdquest}
      POSTGRES_USER: ${POSTGRES_USER:-crowdquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdquest} -d ${POSTGRES_DB:-crowdquest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run python scripts/bootstrap_env.py first}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crowdquest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crowdquest}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  twitch-worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runtime"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crowdquest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crowdquest}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, edge]
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-127.0.0.1:3000}:3000"
    networks: [edge]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    internal: true
  edge:
    driver: bridge
