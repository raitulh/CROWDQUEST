[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crowdquest-api"
version = "1.0.0"
description = "Production-oriented Twitch community quest platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.160.0",
  "uvicorn[standard]>=0.35,<1.0",
  "SQLAlchemy[asyncio]>=2.0.46,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.21,<1.0",
  "alembic>=1.16,<2.0",
  "redis>=6.4,<7.0",
  "httpx>=0.28,<1.0",
  "websockets>=15.0,<17.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "cryptography>=46.0,<47.0",
  "PyJWT>=2.10,<3.0",
  "orjson>=3.10,<4.0",
  "email-validator>=2.2,<3.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.14,<1.0",
  "mypy>=1.18,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501"]
